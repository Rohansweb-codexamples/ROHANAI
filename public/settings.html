<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d19"><title>Rohan AI — Settings</title><link rel="stylesheet" href="/controller.css?v=5"><style>
body{padding:22px 16px 40px}.settings{width:min(100%,560px);margin:auto}.settings h1{font:700 38px "Space Grotesk";margin:22px 0 8px}.settings p{color:#9baac1;font-size:13px;line-height:1.6}.setting-card{background:linear-gradient(145deg,#142139f5,#0e1729f5);border:1px solid #273750;border-radius:20px;padding:19px;margin-top:16px}.setting-card h2{font:700 18px "Space Grotesk";margin:0 0 14px}.swatches{display:flex;gap:12px;flex-wrap:wrap}.swatch{width:43px;height:43px;border-radius:50%;border:3px solid #fff3;cursor:pointer}.swatch[aria-pressed=true]{outline:2px solid white;outline-offset:3px}.backgrounds{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.backgrounds button{min-height:72px;border:1px solid #53617b;border-radius:13px;color:white;font-weight:800;cursor:pointer}.save{margin-top:18px;width:100%;border:0;border-radius:13px;padding:15px;background:linear-gradient(100deg,#ffad58,#f16b32);font-weight:900;color:#211621}.back{display:inline-block;color:#ffb06b;text-decoration:none;font-size:11px;font-weight:900;letter-spacing:1px}.hint{font-size:10px!important;color:#8192aa!important}
</style></head><body><main class="settings"><a class="back" href="/">← BACK TO CONTROLLER</a><h1>Settings</h1><p>Change the look of your Rohan AI controller. Your choices are saved on this device.</p>
<section class="setting-card"><h2>Accent colour</h2><div class="swatches"><button class="swatch" data-accent="#ff9b4a" data-second="#f16b32" style="background:linear-gradient(135deg,#ffb45e,#f16b32)" aria-label="Orange" aria-pressed="true"></button><button class="swatch" data-accent="#4bbcff" data-second="#2865e8" style="background:linear-gradient(135deg,#73e4ff,#2865e8)" aria-label="Blue" aria-pressed="false"></button><button class="swatch" data-accent="#a987ff" data-second="#6546db" style="background:linear-gradient(135deg,#d5baff,#6546db)" aria-label="Purple" aria-pressed="false"></button><button class="swatch" data-accent="#55dfa9" data-second="#149b79" style="background:linear-gradient(135deg,#9bffd3,#149b79)" aria-label="Green" aria-pressed="false"></button><button class="swatch" data-accent="#ff6d9e" data-second="#c83275" style="background:linear-gradient(135deg,#ffb2c9,#c83275)" aria-label="Pink" aria-pressed="false"></button><button class="swatch" data-accent="#ffe06b" data-second="#e58a27" style="background:linear-gradient(135deg,#fff3a2,#e58a27)" aria-label="Yellow" aria-pressed="false"></button></div></section>
<section class="setting-card"><h2>Background</h2><div class="backgrounds"><button data-bg="space" style="background:radial-gradient(ellipse at 85% 0,#392044,transparent 60%),radial-gradient(ellipse at 0 35%,#142c49,transparent 60%),#080d19">Deep space</button><button data-bg="sunset" style="background:linear-gradient(145deg,#562447,#bd583b,#f0a34c)">Sunset</button><button data-bg="ocean" style="background:linear-gradient(145deg,#061d39,#075d79,#25a7a4)">Ocean</button><button data-bg="aurora" style="background:linear-gradient(145deg,#071c2a,#176c65,#58448d)">Aurora</button><button data-bg="ember" style="background:linear-gradient(145deg,#28101b,#792c28,#d56b32)">Ember</button><button data-bg="midnight" style="background:linear-gradient(145deg,#050711,#17213c,#24213e)">Midnight</button></div><p class="hint">Backgrounds change the controller screen only. The speaker keeps its own display.</p></section>
<button class="save" id="save">SAVE SETTINGS</button></main><script>
(()=>{const key="rohanControllerSettings";const presets={space:"radial-gradient(ellipse at 85% 0,#392044 0,transparent 37%),radial-gradient(ellipse at 0 35%,#142c49 0,transparent 43%),#080d19",sunset:"linear-gradient(145deg,#562447,#bd583b,#f0a34c)",ocean:"linear-gradient(145deg,#061d39,#075d79,#25a7a4)",aurora:"linear-gradient(145deg,#071c2a,#176c65,#58448d)",ember:"linear-gradient(145deg,#28101b,#792c28,#d56b32)",midnight:"linear-gradient(145deg,#050711,#17213c,#24213e)"};let state=JSON.parse(localStorage.getItem(key)||"{}");function render(){document.querySelectorAll(".swatch").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.accent===(state.accent||"#ff9b4a"))));}document.querySelectorAll(".swatch").forEach(b=>b.onclick=()=>{state.accent=b.dataset.accent;state.accent2=b.dataset.second;render();});document.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{state.background=presets[b.dataset.bg];document.querySelectorAll("[data-bg]").forEach(x=>x.style.outline=x===b?"2px solid white":"none");});document.querySelector("#save").onclick=()=>{localStorage.setItem(key,JSON.stringify(state));location.href="/";};render();})();</script></body></html>
