<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d19"><title>Rohan AI · Settings</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/controller.css?v=11"><style>
body{padding:20px 15px 40px}.settings{width:min(100%,560px);margin:auto}.back{color:var(--accent);text-decoration:none;font-size:10px;font-weight:900;letter-spacing:1px}.settings h1{font:700 36px "Space Grotesk";margin:25px 0 5px}.intro{color:#9aabc1;font-size:12px;line-height:1.6;margin:0 0 20px}.group{padding:18px;margin:13px 0;border:1px solid #2b3c55;border-radius:20px;background:rgba(16,28,47,.94)}.group h2{font:700 16px "Space Grotesk";margin:0 0 14px}.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.swatch{display:flex;align-items:center;gap:8px;padding:9px 7px;border:1px solid #394b64;border-radius:12px;background:#0a1526;color:#eaf0f9;font-size:10px;font-weight:700}.swatch i{width:23px;height:23px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2))}.swatch[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.backgrounds{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.background-choice{height:76px;border:1px solid #53617b;border-radius:13px;color:white;text-align:left;padding:10px;display:flex;align-items:flex-end;font-size:11px;font-weight:900}.background-choice[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}.preview{border:1px solid #3a4b65;border-radius:16px;padding:14px;margin-top:14px;background:var(--page-bg)}.preview small{color:var(--accent);font-size:8px;font-weight:900;letter-spacing:1.5px}.preview strong{display:block;font:700 19px "Space Grotesk";margin-top:5px}.preview button,.save{border:0;border-radius:11px;padding:12px 15px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#211722;font-size:10px;font-weight:900;margin-top:10px}.actions{display:flex;gap:10px}.actions button{flex:1;border-radius:12px;padding:14px;border:1px solid #3b4b62;background:#14223a;color:white;font-size:10px;font-weight:900}.actions .save{margin:0;border:0;color:#211722}
</style></head><body><main class="settings"><a class="back" href="/">← BACK TO CONTROLLER</a><h1>Make it yours.</h1><p class="intro">Choose a colour and background. Preview your choices, then save them to the controller on this device.</p>
<section class="group"><h2>Accent colour</h2><div class="swatches">
<button class="swatch" data-accent="#ff9d55" data-second="#ed6738"><i style="--c1:#ff9d55;--c2:#ed6738"></i>Orange</button><button class="swatch" data-accent="#53c7ff" data-second="#2868e9"><i style="--c1:#53c7ff;--c2:#2868e9"></i>Blue</button><button class="swatch" data-accent="#ad8aff" data-second="#6746dc"><i style="--c1:#ad8aff;--c2:#6746dc"></i>Purple</button><button class="swatch" data-accent="#55dfad" data-second="#168f72"><i style="--c1:#55dfad;--c2:#168f72"></i>Green</button><button class="swatch" data-accent="#ff78a8" data-second="#c83779"><i style="--c1:#ff78a8;--c2:#c83779"></i>Pink</button><button class="swatch" data-accent="#ffe06d" data-second="#e58a27"><i style="--c1:#ffe06d;--c2:#e58a27"></i>Yellow</button></div></section>
<section class="group"><h2>Background</h2><div class="backgrounds">
<button class="background-choice" data-bg="space" style="background:radial-gradient(ellipse at 80% 0,#59305f,transparent 60%),linear-gradient(145deg,#09172b,#10101f)">Deep space</button><button class="background-choice" data-bg="sunset" style="background:linear-gradient(145deg,#512343,#bb573d,#eea04a)">Sunset</button><button class="background-choice" data-bg="ocean" style="background:linear-gradient(145deg,#061d39,#075d79,#25a7a4)">Ocean</button><button class="background-choice" data-bg="aurora" style="background:linear-gradient(145deg,#071c2a,#176c65,#58448d)">Aurora</button><button class="background-choice" data-bg="ember" style="background:linear-gradient(145deg,#28101b,#792c28,#d56b32)">Ember</button><button class="background-choice" data-bg="midnight" style="background:linear-gradient(145deg,#050711,#17213c,#24213e)">Midnight</button></div><div class="preview" id="preview"><small>ROHAN AI · PREVIEW</small><strong>Your remote, your style.</strong><button>CONTROL MUSIC</button></div></section>
<div class="actions"><button id="reset">RESET</button><button class="save" id="save">SAVE SETTINGS</button></div></main><script>
(()=>{const KEY="rohanControllerSettings";const backgrounds={space:"radial-gradient(ellipse at 82% 0%,#32213e 0%,transparent 34%),radial-gradient(ellipse at 0% 40%,#132b48 0%,transparent 42%),#080d18",sunset:"linear-gradient(145deg,#512343,#bb573d,#eea04a)",ocean:"linear-gradient(145deg,#061d39,#075d79,#25a7a4)",aurora:"linear-gradient(145deg,#071c2a,#176c65,#58448d)",ember:"linear-gradient(145deg,#28101b,#792c28,#d56b32)",midnight:"linear-gradient(145deg,#050711,#17213c,#24213e)"};const defaults={accent:"#ff9d55",accent2:"#ed6738",background:backgrounds.space};let state={...defaults};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{}const preview=document.querySelector("#preview");function paint(){document.documentElement.style.setProperty("--accent",state.accent);document.documentElement.style.setProperty("--accent2",state.accent2);document.documentElement.style.setProperty("--page-bg",state.background);preview.style.background=state.background;document.querySelectorAll("[data-accent]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.accent===state.accent)));document.querySelectorAll("[data-bg]").forEach(b=>b.setAttribute("aria-pressed",String(backgrounds[b.dataset.bg]===state.background)));}document.querySelectorAll("[data-accent]").forEach(b=>b.addEventListener("click",()=>{state.accent=b.dataset.accent;state.accent2=b.dataset.second;paint()}));document.querySelectorAll("[data-bg]").forEach(b=>b.addEventListener("click",()=>{state.background=backgrounds[b.dataset.bg];paint()}));document.querySelector("#save").addEventListener("click",()=>{localStorage.setItem(KEY,JSON.stringify(state));const b=document.querySelector("#save");b.textContent="SAVED";setTimeout(()=>b.textContent="SAVE SETTINGS",1400)});document.querySelector("#reset").addEventListener("click",()=>{state={...defaults};paint();localStorage.setItem(KEY,JSON.stringify(state))});paint()})();</script></body></html>
