<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<meta name="description" content="Spark voice speaker">
<title>Rohan AI Speaker</title>
<link rel="manifest" href="/speaker.webmanifest">
<link rel="icon" href="/speaker-icon.svg">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060914;color:#eff7ff;font-family:Inter,system-ui,sans-serif}
body{min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 48%,#172c50 0%,#0b1429 38%,#060914 76%);touch-action:manipulation}
.stage{width:100%;height:100dvh;display:grid;place-items:center;position:relative}
.spark{width:min(58vw,min(58vh,300px));aspect-ratio:1;border:0;border-radius:50%;padding:0;display:grid;place-items:center;position:relative;cursor:pointer;background:radial-gradient(circle at 32% 25%,#e7fbff 0%,#69d7ff 32%,#387bd9 64%,#34236d 100%);box-shadow:0 0 42px #5bcaff77,0 0 115px #456be455,inset 0 0 28px #fff8;transition:background .25s,box-shadow .25s,transform .25s;-webkit-tap-highlight-color:transparent}
.spark:before,.spark:after{content:"";position:absolute;inset:-13%;border:1px solid #76d9ff66;border-radius:50%;animation:ring 4s ease-in-out infinite;pointer-events:none}
.spark:after{inset:-25%;opacity:.5;animation-delay:-2s}
.spark span{font-size:clamp(48px,14vw,100px);font-weight:900;letter-spacing:-.08em;color:#07162a;text-shadow:0 2px 14px #fff9;user-select:none}
.spark.listening{background:radial-gradient(circle at 32% 25%,#fff4db,#ffb34d 36%,#f16c32 68%,#702d57);box-shadow:0 0 55px #ff9b42aa,0 0 140px #ff692f55,inset 0 0 30px #fff9;transform:scale(1.035)}
.spark.speaking{background:radial-gradient(circle at 32% 25%,#f3eaff,#c18aff 36%,#7959ec 68%,#32216e);box-shadow:0 0 55px #a783ffaa,0 0 140px #765bff66,inset 0 0 30px #fff9}
.spark.error{background:radial-gradient(circle at 32% 25%,#fff,#ff7777 36%,#b62d55 70%,#42172e);box-shadow:0 0 45px #ff557788}
.clock-panel{position:absolute;top:max(24px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none}.clock{font:700 clamp(28px,7vw,42px) "Space Grotesk",sans-serif;letter-spacing:1px;color:#f1f6ff;text-shadow:0 3px 24px #6fcaff66}.timer-display{min-height:20px;margin-top:7px;color:#ffbd78;font:800 12px "Inter",system-ui,sans-serif;letter-spacing:2px}.timer-display.active{color:#ffc06d;text-shadow:0 0 18px #ff9d4b88}.pair-code{display:none}
.spark:focus-visible{outline:3px solid white;outline-offset:22px}
@keyframes ring{50%{transform:scale(1.07);opacity:.2}}
@media(prefers-reduced-motion:reduce){.spark:before,.spark:after{animation:none}}
</style>
</head>
<body>
<main class="stage">
<div class="clock-panel"><div class="clock" id="clock">--:--:--</div><div class="timer-display" id="timerDisplay"></div></div><button class="spark" id="spark" type="button" aria-label="Tap once to activate Spark voice listening"><span>S</span></button>
<div class="pair-code" id="pairCode" aria-hidden="true"></div>
</main>
<audio id="audio" preload="metadata"></audio>
<script src="/speaker.js?v=9"></script>
</body>
</html>
